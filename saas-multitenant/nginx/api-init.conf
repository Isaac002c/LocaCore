# ============================================================
# FASE 1 — Config temporária para emitir o certificado SSL
# Use este arquivo ANTES de ter o certificado Let's Encrypt.
# Depois de emitir, copie api.conf para default.conf e recarregue.
# ============================================================

server {
    listen 80;
    server_name api-despachante.chronostek.com.br;

    # Desafio webroot do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tudo mais vai para o backend temporariamente via HTTP
    location / {
        proxy_pass         http://despachante-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
    }
}
