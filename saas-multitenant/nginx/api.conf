# ============================================================
# FASE 2 — Config de produção com HTTPS + Let's Encrypt
# Usar após emitir o certificado com certbot.
# ============================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name api-despachante.chronostek.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS com proxy para o backend
server {
    listen 443 ssl;
    http2 on;
    server_name api-despachante.chronostek.com.br;

    ssl_certificate     /etc/letsencrypt/live/api-despachante.chronostek.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-despachante.chronostek.com.br/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (habilita só depois de confirmar que HTTPS funciona)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Tamanho máximo do body — deve bater com o limite do Express (10mb)
    client_max_body_size 10m;

    # Proxy para o backend Express
    location / {
        proxy_pass         http://despachante-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Evita buffering desnecessário para respostas JSON
        proxy_buffering off;
    }
}
