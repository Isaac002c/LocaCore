# =============================================================================
# LocaCore — Docker Compose de PRODUÇÃO (VPS). Serviços separados: API, worker,
# scheduler, Postgres, frontend, proxy e backup. NÃO executado neste ambiente
# (sem Docker); testado por revisão. Ajuste os hosts/segredos em .env.prod.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
# =============================================================================
version: "3.9"

x-backend-image: &backend-image
  build:
    context: ../backend
    dockerfile: Dockerfile
  image: locacore-backend:latest
  env_file: [../.env.prod]
  environment:
    NODE_ENV: production
  networks: [locacore]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    migrate:  { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    container_name: locacore-postgres
    env_file: [../.env.prod]           # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [locacore]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  # One-shot: aplica as migrations (runner com lock + checksum) e sai.
  migrate:
    <<: *backend-image
    container_name: locacore-migrate
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    command: ["node", "scripts/migrate.js", "up"]

  backend:
    <<: *backend-image
    container_name: locacore-backend
    command: ["node", "app.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    <<: *backend-image
    container_name: locacore-worker
    command: ["node", "worker.js"]
    stop_grace_period: 15s              # tempo para o shutdown gracioso (SIGTERM)
    deploy:
      resources:
        limits: { memory: 384m }

  scheduler:
    <<: *backend-image
    container_name: locacore-scheduler
    command: ["node", "scheduler.js"]
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { memory: 256m }

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    image: locacore-frontend:latest
    container_name: locacore-frontend
    env_file: [../.env.prod]
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:5000
    networks: [locacore]
    restart: unless-stopped
    depends_on: [backend]

  proxy:
    image: nginx:alpine
    container_name: locacore-proxy
    volumes:
      - ../nginx:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
    ports: ["80:80", "443:443"]
    networks: [locacore]
    restart: unless-stopped
    depends_on: [backend, frontend]

  # Backup diário do Postgres (pg_dump comprimido + retenção). Ver scripts/backup.sh.
  backup:
    image: postgres:16-alpine
    container_name: locacore-backup
    env_file: [../.env.prod]
    volumes:
      - ./backups:/backups
      - ../backend/scripts:/scripts:ro
    networks: [locacore]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup.sh; sleep 86400; done"]

networks:
  locacore:
    driver: bridge

volumes:
  pgdata:
  certs:
