# =============================================================================
# LocaCore — Docker Compose de PRODUÇÃO (VPS).
#
# Arquitetura alvo: BACKEND + POSTGRES na VPS; FRONTEND na VERCEL.
# Por isso o serviço `frontend` fica atrás do profile "frontend" (NÃO sobe por
# padrão) — a Vercel serve o Next.js e faz proxy /api|/auth para esta API.
#
#   cd /opt/locacore/saas-multitenant
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
#
# Fase 1 (sem certificado): NGINX_TEMPLATES=templates-init
# Fase 2 (com certificado):  NGINX_TEMPLATES=templates
# Passo a passo completo: deploy/DEPLOY_LOCACORE.md
# =============================================================================

x-backend-image: &backend-image
  build:
    context: ../backend
    dockerfile: Dockerfile
  image: locacore-backend:latest
  env_file: [../.env.prod]
  environment:
    NODE_ENV: production
  networks: [locacore]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    migrate:  { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    container_name: locacore-postgres
    env_file: [../.env.prod]           # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [locacore]
    restart: unless-stopped
    # SEM `ports:` — o banco fica só na rede interna do Docker, não exposto na VPS.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  # One-shot: aplica as migrations (runner com lock + checksum) e sai.
  migrate:
    <<: *backend-image
    container_name: locacore-migrate
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    command: ["node", "scripts/migrate.js", "up"]

  backend:
    <<: *backend-image
    container_name: locacore-backend
    command: ["node", "app.js"]
    volumes:
      - uploads:/app/uploads          # uploads persistem entre rebuilds/deploys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    <<: *backend-image
    container_name: locacore-worker
    command: ["node", "worker.js"]
    volumes:
      - uploads:/app/uploads          # mesmo storage local da API
    stop_grace_period: 15s            # tempo para o shutdown gracioso (SIGTERM)
    deploy:
      resources:
        limits: { memory: 384m }

  scheduler:
    <<: *backend-image
    container_name: locacore-scheduler
    command: ["node", "scheduler.js"]
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { memory: 256m }

  # Reverse proxy + TLS. Templates com envsubst: só ${API_DOMAIN} é substituído
  # (NGINX_ENVSUBST_FILTER), preservando $host/$remote_addr do próprio nginx.
  proxy:
    image: nginx:alpine
    container_name: locacore-proxy
    environment:
      API_DOMAIN: ${API_DOMAIN}
      NGINX_ENVSUBST_FILTER: API_DOMAIN
    volumes:
      - ../nginx/${NGINX_TEMPLATES:-templates-init}:/etc/nginx/templates:ro
      - certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports: ["80:80", "443:443"]
    networks: [locacore]
    restart: unless-stopped
    depends_on: [backend]

  # Renovação automática do certificado (a EMISSÃO inicial é manual — ver runbook).
  certbot:
    image: certbot/certbot:latest
    container_name: locacore-certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [locacore]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  # Backup diário do Postgres (pg_dump comprimido + retenção). Ver scripts/backup.sh.
  backup:
    image: postgres:16-alpine
    container_name: locacore-backup
    env_file: [../.env.prod]
    volumes:
      - ./backups:/backups
      - ../backend/scripts:/scripts:ro
    networks: [locacore]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup.sh; sleep 86400; done"]

  # OPCIONAL — só se você quiser servir o frontend na PRÓPRIA VPS em vez da Vercel.
  # Suba com: docker compose ... --profile frontend up -d
  frontend:
    profiles: ["frontend"]
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    image: locacore-frontend:latest
    container_name: locacore-frontend
    env_file: [../.env.prod]
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:5000
    networks: [locacore]
    restart: unless-stopped
    depends_on: [backend]

networks:
  locacore:
    driver: bridge

volumes:
  pgdata:
  certs:
  certbot_www:
  uploads:
