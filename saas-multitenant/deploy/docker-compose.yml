# =============================================================================
# NEXOS — Stack de deploy NOVO e ISOLADO. Convive com outros sistemas na VPS
# sem tocar em nada existente: nomes nexos-*, rede/volumes próprios, e o Postgres
# NÃO publica porta no host (5432/5433 já usados por outros sistemas).
#
# Subir (só banco + backend):
#   docker compose -f deploy/docker-compose.yml up -d postgres backend
# Proxy/SSL (quando houver domínio) — profile "proxy":
#   docker compose -f deploy/docker-compose.yml --profile proxy up -d nginx
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: nexos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexos}
    volumes:
      - nexos-postgres-data:/var/lib/postgresql/data
    # SEM ports: acesso só pela rede interna nexos-network (5432/5433 do host ocupados).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexos} -d ${POSTGRES_DB:-nexos}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [nexos-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexos-backend
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nexos-backend-uploads:/app/uploads
    # Porta local (só localhost do VPS) para smoke test enquanto não há proxy/domínio.
    ports:
      - "127.0.0.1:${NEXOS_BACKEND_PORT:-8095}:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [nexos-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ── Frontend Nexos (Next.js) ────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: nexos-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Proxy interno do Next (rewrites /api e /auth) → backend na rede nexos.
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NEXOS_FRONTEND_PORT:-8096}:3001"
    networks: [nexos-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ── Cloudflare Tunnel NOMEADO e persistente (API pública em HTTPS) ───────────
  # Publica o backend em https://api-nexos.chronostek.com.br SEM abrir porta no host.
  # A rota é configurada no painel Cloudflare (Zero Trust → Networks → Tunnels):
  #   Public hostname: api-nexos.chronostek.com.br  →  Service: http://nexos-backend:5000
  # O token do túnel fica em deploy/tunnel.env (TUNNEL_TOKEN=..., chmod 600, fora do git).
  # Cloudflared conecta ao backend pela rede interna nexos-network (nunca 127.0.0.1).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nexos-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: ./tunnel.env
    depends_on:
      backend:
        condition: service_healthy
    networks: [nexos-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ── Proxy/SSL (profile "proxy") — só quando houver domínio + portas livres ──
  nginx:
    image: nginx:1.27-alpine
    container_name: nexos-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "${NEXOS_HTTP_PORT:-8088}:80"
      - "${NEXOS_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nexos-certs:/etc/letsencrypt:ro
      - nexos-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [nexos-network]
    logging: { driver: "json-file", options: { max-size: "5m", max-file: "2" } }

  certbot:
    image: certbot/certbot:latest
    container_name: nexos-certbot
    profiles: ["proxy"]
    volumes:
      - nexos-certs:/etc/letsencrypt
      - nexos-webroot:/var/www/certbot

volumes:
  nexos-postgres-data:   { name: nexos-postgres-data }
  nexos-backend-uploads: { name: nexos-backend-uploads }
  nexos-certs:           { name: nexos-certs }
  nexos-webroot:         { name: nexos-webroot }

networks:
  nexos-network:
    name: nexos-network
