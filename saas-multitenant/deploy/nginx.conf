# =============================================================================
# Nginx — reverse proxy + SSL para a API do NEXO (deploy novo).
# Antes de subir com SSL, troque __API_DOMAIN__ pelo domínio real:
#   sed -i 's/__API_DOMAIN__/api.seu-dominio.com/g' deploy/nginx.conf
# (Ver DEPLOY.md para a emissão do certificado.)
# =============================================================================

# HTTP: desafio ACME (certbot) + redirect para HTTPS
server {
    listen 80;
    server_name __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: termina SSL e faz proxy para o backend
server {
    listen 443 ssl;
    http2 on;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12m;

    # Proxy para o container do backend (mesma rede docker)
    location / {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
